# Isolated local demonstration: scripted answers, fictional data, no LLM calls.
name: knoventra-demo

services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: knoventra
      POSTGRES_PASSWORD: knoventra-demo-only
      POSTGRES_DB: knoventra_demo
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knoventra -d knoventra_demo"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.demo-api
    environment:
      KNV_DATABASE_URL: postgresql+psycopg://knoventra:knoventra-demo-only@db:5432/knoventra_demo
      KNV_ENCODER: hash
      KNV_RERANK: 'off'
      KNV_ENV: dev
      KNV_LLM_API_KEY: ''
      KNV_LLM_BASE_URL: ''
      KNV_LLM_MODEL: ''
      HF_HUB_OFFLINE: '1'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.demo-web
    ports:
      - "127.0.0.1:${KNV_DEMO_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  demo_pgdata:
